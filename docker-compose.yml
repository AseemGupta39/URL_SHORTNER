version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: url-shortener-db
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-network

  # Redis Queue
  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-network

  # Shorten Service
  shorten:
    build:
      context: .
      dockerfile: services/shorten/Dockerfile
    container_name: url-shortener-shorten
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
      - DB_POOL_SIZE=20
      - DB_POOL_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=3600
      - DB_POOL_PRE_PING=true
      - DB_ECHO_POOL=false

      # Redis & Queue
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - QUEUE_ENABLED=true

      # Redis Connection Pooling
      - REDIS_POOL_MAX_CONNECTIONS=100
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5

      # ID Generator
      - DATACENTER_ID=0
      - WORKER_ID=0
      - EPOCH_SEC=1704067200
      - TIMESTAMP_BITS=28
      - DATACENTER_BITS=4
      - WORKER_BITS=2
      - SEQUENCE_BITS=7

      # Application
      - BASE_DOMAIN=localhost:8002
      - BASE_URL_SCHEME=http

      # Server
      - HOST=0.0.0.0
      - PORT=8001
      - RELOAD=false

      # CORS
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500

      # Cache
      - CACHE_ENABLED=true
      - CACHE_MAX_SIZE=1000
      - CACHE_TTL_SECONDS=3600

      # Logging
      - LOG_LEVEL=INFO
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - url-shortener-network
    restart: unless-stopped

  # Redirect Service
  redirect:
    build:
      context: .
      dockerfile: services/redirect/Dockerfile
    container_name: url-shortener-redirect
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
      - DB_POOL_SIZE=20
      - DB_POOL_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=3600
      - DB_POOL_PRE_PING=true
      - DB_ECHO_POOL=false

      # Redis & Queue
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - QUEUE_ENABLED=true

      # Redis Connection Pooling
      - REDIS_POOL_MAX_CONNECTIONS=100
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5

      # Server
      - HOST=0.0.0.0
      - PORT=8002
      - RELOAD=false

      # CORS
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500

      # Cache
      - CACHE_ENABLED=true
      - CACHE_MAX_SIZE=1000
      - CACHE_TTL_SECONDS=3600

      # Logging
      - LOG_LEVEL=INFO
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - url-shortener-network
    restart: unless-stopped

  # Batch Processor Service
  batch_processor:
    build:
      context: .
      dockerfile: services/batch_processor/Dockerfile
    container_name: url-shortener-batch
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
      - DB_POOL_SIZE=20
      - DB_POOL_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=3600
      - DB_POOL_PRE_PING=true
      - DB_ECHO_POOL=false

      # Redis & Queue
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - QUEUE_ENABLED=true
      - BATCH_SIZE=100
      - BATCH_INTERVAL_SECONDS=10
      - ENABLE_BACKGROUND_SCHEDULER=true

      # Redis Connection Pooling
      - REDIS_POOL_MAX_CONNECTIONS=100
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5

      # Server
      - HOST=0.0.0.0
      - PORT=8003
      - RELOAD=false

      # CORS
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500

      # Logging
      - LOG_LEVEL=INFO
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - url-shortener-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  url-shortener-network:
    driver: bridge

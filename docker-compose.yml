version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: url-shortener-db
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - url-shortener-network

  # Redis Queue - DISABLED for localhost testing
  # Uncomment to use Docker Redis instead of localhost Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: url-shortener-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - url-shortener-network

  # Shorten Service
  shorten:
    build:
      context: .
      dockerfile: services/shorten/Dockerfile
    container_name: url-shortener-shorten
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
      - DB_POOL_SIZE=20
      - DB_POOL_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=3600
      - DB_POOL_PRE_PING=true
      - DB_ECHO_POOL=false

      # Redis & Queue - in-container sidecar for pool vs network isolation test
      - REDIS_URL=redis://127.0.0.1:6379
      - REDIS_ENABLED=true

      # Redis Connection Pooling (increased for load testing)
      - REDIS_POOL_MAX_CONNECTIONS=4000
      - REDIS_SOCKET_TIMEOUT=5
      - REDIS_SOCKET_CONNECT_TIMEOUT=5

      # ID Generator
      - DATACENTER_ID=0
      - WORKER_ID=0
      - EPOCH_SEC=1704067200
      - TIMESTAMP_BITS=31
      - DATACENTER_BITS=4
      - WORKER_BITS=2
      - SEQUENCE_BITS=10

      # Application
      - BASE_DOMAIN=localhost:8002
      - BASE_URL_SCHEME=http

      # Server
      - HOST=0.0.0.0
      - PORT=8001
      - RELOAD=false

      # CORS
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500

      # Cache (always enabled)
      - CACHE_MAX_SIZE=1000
      - CACHE_TTL_SECONDS=3600

      # Logging
      - LOG_LEVEL=DEBUG
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis dependency removed - using localhost Redis
    networks:
      - url-shortener-network
    restart: unless-stopped

  # Redirect Service
  # redirect:
  #   build:
  #     context: .
  #     dockerfile: services/redirect/Dockerfile
  #   container_name: url-shortener-redirect
  #   environment:
  #     # Database
  #     - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
  #     - DB_POOL_SIZE=20
  #     - DB_POOL_MAX_OVERFLOW=10
  #     - DB_POOL_TIMEOUT=30
  #     - DB_POOL_RECYCLE=3600
  #     - DB_POOL_PRE_PING=true
  #     - DB_ECHO_POOL=false

  #     # Redis & Queue (queue is always enabled - just set REDIS_URL)
  #     - REDIS_URL=redis://172.17.0.1:6379
  #     - REDIS_ENABLED=true

  #     # Redis Connection Pooling
  #     - REDIS_POOL_MAX_CONNECTIONS=100
  #     - REDIS_SOCKET_TIMEOUT=5
  #     - REDIS_SOCKET_CONNECT_TIMEOUT=5

  #     # Server
  #     - HOST=0.0.0.0
  #     - PORT=8002
  #     - RELOAD=false

  #     # CORS
  #     - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500

  #     # Cache (always enabled)
  #     - CACHE_MAX_SIZE=1000
  #     - CACHE_TTL_SECONDS=3600

  #     # Logging
  #     - LOG_LEVEL=DEBUG
  #   ports:
  #     - "8002:8002"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     # Redis dependency removed - using localhost Redis
  #   networks:
  #     - url-shortener-network
  #   restart: unless-stopped

  # Batch Processor Service - DISABLED for sidecar perf test (shorten uses its own Redis)
  # batch_processor:
  #   build:
  #     context: .
  #     dockerfile: services/batch_processor/Dockerfile
  #   container_name: url-shortener-batch
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
  #     - REDIS_URL=redis://172.17.0.1:6379
  #     - REDIS_ENABLED=true
  #     - BATCH_SIZE=1000
  #     - BATCH_INTERVAL_SECONDS=10
  #     - ENABLE_BACKGROUND_SCHEDULER=true
  #     - REDIS_POOL_MAX_CONNECTIONS=100
  #     - HOST=0.0.0.0
  #     - PORT=8003
  #     - LOG_LEVEL=DEBUG
  #   ports:
  #     - "8003:8003"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - url-shortener-network
  #   restart: unless-stopped

  # Click Processor Service (independent scaling from batch_processor)
  # click_processor:
  #   build:
  #     context: .
  #     dockerfile: services/click_processor/Dockerfile
  #   container_name: url-shortener-click
  #   environment:
  #     # Database
  #     - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/url_shortener
  #     - DB_POOL_SIZE=20
  #     - DB_POOL_MAX_OVERFLOW=10
  #     - DB_POOL_TIMEOUT=30
  #     - DB_POOL_RECYCLE=3600
  #     - DB_POOL_PRE_PING=true
  #     - DB_ECHO_POOL=false

  #     # Redis & Queue
  #     - REDIS_URL=redis://172.17.0.1:6379
  #     - BATCH_SIZE=100
  #     - CLICK_BATCH_INTERVAL_SECONDS=5
  #     - ENABLE_BACKGROUND_SCHEDULER=true

  #     # Redis Connection Pooling
  #     - REDIS_POOL_MAX_CONNECTIONS=100
  #     - REDIS_QUEUE_SOCKET_TIMEOUT=3
  #     - REDIS_QUEUE_CONNECT_TIMEOUT=2

  #     # Server
  #     - HOST=0.0.0.0
  #     - PORT=8004
  #     - RELOAD=false

  #     # Logging
  #     - LOG_LEVEL=DEBUG
  #   ports:
  #     - "8004:8004"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     # Redis dependency removed - using localhost Redis
  #   networks:
  #     - url-shortener-network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  url-shortener-network:
    driver: bridge
